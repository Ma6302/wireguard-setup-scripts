[notify]
# 通知渠道（目前支持 serverchan）
provider = serverchan
# 在 sct.ftqq.com 用微信扫码登录后获取 SendKey，形如 SCTxxxxxxxx...，填到这里
sendkey =

[traffic]
# 当日累计流量达到该值即告警（GB，0=禁用告警）；每天最多告警 1 次，跨天自动重置
daily_threshold_gb = 20
# 快照间隔（分钟）：越小越精细，阈值告警的感知延迟也越小
snapshot_interval_min = 30

[report]
# 日报按北京时间推送（服务器时区不同没关系，脚本自动换算 cron）
utc_offset = 8
report_hour = 23
report_minute = 30

[peers]
# 可选手动映射（内网 IP = 设备名）。留空则自动解析 /root/*.conf 文件名
# 例：10.7.0.2 = phone

[update]
# 自动更新：开启后每天推送日报时检查新版并自动安装
auto_update = true
# 更新通道：release=从项目 Release 标签（整仓快照，只装你发布过的版本）
#           main=从 main 分支下载（跟随最新提交，含未发布变更）
channel = release
repo_slug = Ma6302/wireguard-setup-scripts
